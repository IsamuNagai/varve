name: fuzz

# Long randomized fuzzing of every parser (node/crates/varve-fuzz), every night with a
# fresh random seed. A failing input is uploaded as an artifact and the run fails.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, pinned (Node 24)
        with:
          persist-credentials: false
      - name: Build pinned C dependencies (liboqs, patched RandomX)
        run: sh tools/build-deps.sh "$RUNNER_TEMP/deps"
      - name: Build the fuzzer
        working-directory: node
        env:
          VARVE_DEPS: ${{ runner.temp }}/deps
        run: cargo build --release --locked -p varve-fuzz
      - name: Fuzz for 45 minutes
        run: node/target/release/varve-fuzz --seconds 2700 --out fuzz-crashes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, pinned
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz-crashes/
