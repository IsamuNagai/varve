name: hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned
        with:
          persist-credentials: false
      - name: Scan for secrets and personal data
        run: sh tools/check-no-secrets.sh
      - name: Issuance model runs
        run: python3 simulations/issuance.py
