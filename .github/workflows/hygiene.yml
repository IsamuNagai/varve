name: hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned
        with:
          persist-credentials: false
      - name: Scan for secrets and personal data
        run: sh tools/check-no-secrets.sh
      - name: Scan images for metadata
        run: python3 -I tools/check-image-metadata.py
      - name: Issuance model runs
        run: python3 -I simulations/issuance.py
      - name: Prototype tests (signature tests skip without liboqs)
        run: python3 -I prototype/test_proto.py
      - name: Test vectors are reproducible
        run: |
          python3 -I simulations/subsidy.py
          python3 -I tools/gen_vectors.py
          python3 -I tools/params.py
          git diff --exit-code -- test-vectors
