name: node

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: varve-linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: varve-linux-arm64
          - os: macos-15
            artifact: varve-macos-arm64
          - os: windows-2025
            artifact: varve-windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Exact line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, pinned (Node 24)
        with:
          persist-credentials: false
      - name: Build pinned C dependencies (liboqs, patched RandomX)
        run: |
          set -o pipefail
          sh tools/build-deps.sh "$RUNNER_TEMP/deps" 2>&1 | tee "$RUNNER_TEMP/deps-run.txt"
      - name: Dependency build diagnostics (on failure)
        if: failure()
        run: |
          echo "::error title=build-deps output::$(tail -c 1500 "$RUNNER_TEMP/deps-run.txt" 2>/dev/null | tr '\n\r' '  ')"
          for f in "$RUNNER_TEMP"/deps/src/*.log; do
            [ -f "$f" ] || continue
            msg=$(grep -iE "error|fatal|fail" "$f" | head -8 | tr '\n\r' '  ' | cut -c1-1500)
            [ -n "$msg" ] || msg=$(tail -c 1200 "$f" | tr '\n\r' '  ')
            echo "::error title=$(basename "$f")::$msg"
          done
      - name: Unit tests and every test-vector file
        working-directory: node
        env:
          VARVE_DEPS: ${{ runner.temp }}/deps
        run: cargo test --release --locked
      - name: Test diagnostics (on failure)
        if: failure()
        working-directory: node
        env:
          VARVE_DEPS: ${{ runner.temp }}/deps
        run: |
          cargo test --release --locked --no-fail-fast > "$RUNNER_TEMP/test-out.txt" 2>&1 || true
          grep -nE "^test .* FAILED|panicked at|^error|^---- " "$RUNNER_TEMP/test-out.txt" | head -20 | while IFS= read -r l; do
            echo "::error title=test failure::$(printf '%s' "$l" | cut -c1-400)"
          done
          grep -E -A3 "panicked at" "$RUNNER_TEMP/test-out.txt" | head -40 | while IFS= read -r l; do
            [ -n "$l" ] && echo "::error title=panic detail::$(printf '%s' "$l" | cut -c1-400)"
          done
          grep -E "^test result" "$RUNNER_TEMP/test-out.txt" | while IFS= read -r l; do echo "::warning title=test summary::$l"; done
      - name: Build release binary
        working-directory: node
        env:
          VARVE_DEPS: ${{ runner.temp }}/deps
        run: cargo build --release --locked
      - name: Multi-node end-to-end test (regtest)
        if: runner.os == 'Linux'
        env:
          VARVE_E2E_SLOW: "3"
        run: python3 -I node/tests/e2e_regtest.py node/target/release/varve
      - name: Strata wallet end-to-end test (regtest)
        if: runner.os == 'Linux'
        env:
          VARVE_E2E_SLOW: "3"
        run: python3 -I node/tests/strata_e2e.py node/target/release/strata node/target/release/varve
      - name: Package (node, miner and Strata wallet)
        env:
          ART: ${{ matrix.artifact }}
        run: |
          mkdir -p "dist/$ART"
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          cp "node/target/release/varve$ext" "node/target/release/strata$ext" "dist/$ART/"
          cp LICENSE-MIT LICENSE-APACHE "dist/$ART/" 2>/dev/null || true
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$ART.zip" "$ART" > /dev/null
            sha256sum "$ART.zip" > "$ART.zip.sha256"
          else
            tar czf "$ART.tar.gz" "$ART"
            (command -v sha256sum >/dev/null && sha256sum "$ART.tar.gz" || shasum -a 256 "$ART.tar.gz") > "$ART.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, pinned
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz*
            dist/${{ matrix.artifact }}.zip*

  install-script:
    # Runs node/deploy/install.sh exactly as a server operator would, on a fresh Ubuntu VM.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, pinned (Node 24)
        with:
          persist-credentials: false
      - name: Install as a service (node only)
        run: sudo REF="$GITHUB_SHA" sh node/deploy/install.sh
      - name: Service is running and answers RPC
        run: |
          sleep 10
          systemctl is-active varve
          sudo -u varve /usr/local/bin/varve rpc --datadir /var/lib/varve/testnet getblockchaininfo
          sudo journalctl -u varve --no-pager | tail -20
          # the service account must not be able to modify the build or the binary
          ! sudo -u varve test -w /opt/varve-build/build
          ! sudo -u varve test -w /usr/local/bin/varve
      - name: Diagnostics (on failure)
        if: failure()
        run: |
          for f in $(sudo find /opt/varve-build -name "*.log" 2>/dev/null | head -10); do
            echo "::error title=$(basename "$f")::$(sudo tail -c 700 "$f" | tr '\n\r' '  ')"
          done
          out=$(sudo runuser -u varve-build -- sh -c 'cd /opt/varve-build/build/node && /opt/varve-build/.cargo/bin/cargo build --release --locked 2>&1' | tail -40 | tr '\n\r' '  ' | tail -c 3500)
          echo "::error title=cargo build::$out"
          echo "::error title=env::$(sudo runuser -u varve-build -- sh -c 'echo HOME=$HOME; id; command -v cmake git cc c++' | tr '\n' ' ')"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0, pinned
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Varve $TAG (testnet)" \
            --notes "Testnet software: the Varve node and miner, and the Strata wallet. Testnet coins have no value. Built by GitHub Actions from tag $TAG. Verify downloads against SHA256SUMS. See node/README.md." \
            *.tar.gz *.zip SHA256SUMS
