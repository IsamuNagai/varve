[workspace]
resolver = "2"
members = ["crates/varve-sys", "crates/varve-consensus", "crates/varve-wallet", "crates/varve"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[profile.release]
opt-level = 3
overflow-checks = true
debug-assertions = false
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
overflow-checks = true
